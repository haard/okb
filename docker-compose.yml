services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: knowledge-pgvector
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-localdev}
      POSTGRES_DB: knowledge_base
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"  # Non-standard port to avoid conflicts
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge_base"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
