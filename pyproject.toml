[project]
name = "local-kb"
version = "0.1.0"
description = "Personal knowledge base with semantic search for LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.2.0",
    "sentence-transformers>=2.2.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "watchdog>=3.0.0",
    "einops>=0.7.0",
    "click>=8.0.0",
    "modal>=1.0.0",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.23.0"]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
lkb = "lkb.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "lkb"}]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
