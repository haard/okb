[project]
name = "local-kb"
version = "0.1.0"
description = "Personal knowledge base with semantic search for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.2.0",
    "sentence-transformers>=2.2.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "watchdog>=3.0.0",
    "einops>=0.7.0",
    "click>=8.0.0",
    "modal>=1.3.0.post1",
]

[project.optional-dependencies]
modal = ["modal>=0.60.0"]
pdf = ["pymupdf>=1.23.0"]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
lkb = "lkb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lkb"]

[tool.hatch.build.targets.sdist]
include = [
    "lkb/**",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.14.11",
]
