name = "mcp-oauth-shim"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[vars]
# MCP_UPSTREAM_URL set via: wrangler secret put MCP_UPSTREAM_URL
# Other secrets: wrangler secret put GITHUB_CLIENT_ID, etc.

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "YOUR_KV_NAMESPACE_ID"  # wrangler kv namespace create OAUTH_KV
